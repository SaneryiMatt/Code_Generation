<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双接口流式输出演示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .api-section {
            flex: 1;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }
        .output {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 20px 0;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            font-family: monospace;
        }
        input {
            width: 70%;
            padding: 8px;
            margin-right: 10px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #333;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        h1, h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>流式输出演示</h1>

    <!-- 新增：预存代码流式展示区 -->
    <div class="api-section">
        <h2>预存代码流式输出</h2>
        <div>
            <button id="predefined-btn" onclick="startPredefinedStream()">开始流式输出代码</button>
        </div>
        <div id="predefined-output" class="output"></div>
        <span id="predefined-cursor" class="cursor" style="display: none;"></span>
    </div>
    
    <div class="container">
        <!-- LangChain Section -->
        <div class="api-section">
            <h2>LangChain API</h2>
            <div>
                <input type="text" id="langchain-query" placeholder="输入查询内容">
                <button id="langchain-btn" onclick="startStream('langchain')">提交</button>
            </div>
            <div id="langchain-output" class="output"></div>
            <span id="langchain-cursor" class="cursor" style="display: none;"></span>
        </div>
        
        <!-- Dify Section -->
        <div class="api-section">
            <h2>Dify API</h2>
            <div>
                <input type="text" id="dify-query" placeholder="输入查询内容">
                <button id="dify-btn" onclick="startStream('dify')">提交</button>
            </div>
            <div id="dify-output" class="output"></div>
            <span id="dify-cursor" class="cursor" style="display: none;"></span>
        </div>
    </div>

    <script>
        // 新增函数：处理预存代码流
        function startPredefinedStream() {
            const outputDiv = document.getElementById('predefined-output');
            const cursor = document.getElementById('predefined-cursor');
            const submitBtn = document.getElementById('predefined-btn');

            outputDiv.textContent = '';
            submitBtn.disabled = true;
            cursor.style.display = 'inline-block';
            outputDiv.appendChild(cursor);

            // 使用 EventSource 接收流式数据
            const eventSource = new EventSource('/stream/code');

            eventSource.onmessage = (e) => {
                if (e.data === '[DONE]') {
                    eventSource.close();
                    cursor.style.display = 'none';
                    submitBtn.disabled = false;
                    return;
                }

                const textNode = document.createTextNode(e.data);
                outputDiv.insertBefore(textNode, cursor);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            };

            eventSource.onerror = () => {
                outputDiv.textContent += '\nError: Stream closed';
                cursor.style.display = 'none';
                submitBtn.disabled = false;
                eventSource.close();
            };
        }

        function startStream(type) {
            const apiUrl = type === 'langchain' ? '/stream' : '/dify/stream';
            const queryId = `${type}-query`;
            const outputId = `${type}-output`;
            const btnId = `${type}-btn`;
            const cursorId = `${type}-cursor`;
            
            const query = document.getElementById(queryId).value;
            if (!query.trim()) return;
            
            const outputDiv = document.getElementById(outputId);
            const submitBtn = document.getElementById(btnId);
            
            outputDiv.textContent = '';
            submitBtn.disabled = true;
            
            // 显示光标
            const cursor = document.getElementById(cursorId);
            cursor.style.display = 'inline-block';
            outputDiv.appendChild(cursor);
            
            // 使用 fetch 和 ReadableStream
            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query: query })
            }).then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                function readStream() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            cursor.style.display = 'none';
                            submitBtn.disabled = false;
                            return;
                        }
                        
                        const chunk = decoder.decode(value);
                        // 处理SSE格式的数据
                        const lines = chunk.split('\n\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.substring(6);
                                if (data === '[DONE]') {
                                    cursor.style.display = 'none';
                                    submitBtn.disabled = false;
                                    return;
                                }
                                
                                // 在光标前插入文本
                                const textNode = document.createTextNode(data);
                                outputDiv.insertBefore(textNode, cursor);
                                
                                // 滚动到底部
                                outputDiv.scrollTop = outputDiv.scrollHeight;
                            }
                        }
                        
                        return readStream();
                    });
                }
                
                return readStream();
            }).catch(error => {
                console.error('Error:', error);
                outputDiv.textContent += '\nError: ' + error.message;
                cursor.style.display = 'none';
                submitBtn.disabled = false;
            });
        }
        
        // 添加回车键提交功能
        document.getElementById('langchain-query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startStream('langchain');
            }
        });
        
        document.getElementById('dify-query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startStream('dify');
            }
        });
    </script>
</body>
</html>
